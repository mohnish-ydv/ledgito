name: Build Ledgito 1.2 Professional Experience APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate source and schema
        run: |
          python3 tools/validate_project.py
          python3 tools/test_schema.py
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Android lint
        run: |
          if ! gradle --no-daemon lintDebug; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            [ -f "$REPORT" ] && cat "$REPORT"
            exit 1
          fi
      - name: Build installable APK
        run: gradle --no-daemon assembleRelease
      - name: Package artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Ledgito-v1.2.0-Professional-Experience.apk
          sha256sum dist/Ledgito-v1.2.0-Professional-Experience.apk > dist/Ledgito-v1.2.0-Professional-Experience.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgito-v1.2.0-Professional-Experience-APK
          path: dist/*
          if-no-files-found: error
